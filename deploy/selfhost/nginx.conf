server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API is published on the host; use host.docker.internal so proxying works
  # even when Docker bridge inter-container routing is unavailable.
  location /api/ {
    proxy_pass http://host.docker.internal:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Prefer $http_prefer;
    proxy_set_header Range $http_range;
    proxy_pass_header Content-Range;
    proxy_pass_header Preference-Applied;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
