name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install
        run: bun install --minimum-release-age=0
      - name: Typecheck app
        run: bun run typecheck
        working-directory: apps/untitled-app-6ac856247b02af3fede23b91
      - name: Typecheck backend
        run: bun run typecheck
        working-directory: backend
      - name: Unit tests
        run: bun test apps/untitled-app-6ac856247b02af3fede23b91/tests/
      - name: Text interface tests
        run: bun test cli/src/cli.test.ts
      - name: Local SBIR walk
        run: bun cli/src/sbir/work.test.ts
      - name: Offline guide smoke (no API keys)
        run: bun scripts/smoke-offline.ts

  compose-health:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Compose up
        working-directory: deploy/selfhost
        run: |
          cp .env.example .env
          # Offline-first CI: no LLM keys; JWT secret long enough
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-test-secret-at-least-32-characters!!/' .env
          echo 'ASSISTANT_DEV_FALLBACK=1' >> .env
          docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8787/health | grep -q '"ok":true'; then
              echo healthy
              exit 0
            fi
            sleep 3
          done
          docker compose -f deploy/selfhost/docker-compose.yml logs --tail 80
          exit 1
      - name: Assistant retired (list→pursue)
        run: |
          curl -sf http://127.0.0.1:8787/assistant/status | tee /tmp/assistant.json
          grep -Eq 'retired|offline|Pursue' /tmp/assistant.json
      - name: Compose down
        if: always()
        working-directory: deploy/selfhost
        run: docker compose down -v
